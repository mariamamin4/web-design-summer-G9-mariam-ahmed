<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards Hover</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/all.min.css" />
  </head>
  <body class="bg-lightgray">
    <!--task-1-->
    <section class="padding">
      <div class="container display-flex">
        <div class="card">
          <div class="image">
            <img src="images/img1.jfif" alt="" />
          </div>
          <div class="img-bg">
            <h3>Karan singh</h3>
            <p class="text-gray">Graphic Designer</p>
          </div>
        </div>

        <div class="card">
          <div class="image">
            <img src="images/img2.jfif" alt="" />
          </div>
          <div class="img-bg">
            <h3>Dolly Seth</h3>
            <p class="text-gray">Digital Marketing</p>
          </div>
        </div>

        <div class="card">
          <div class="image">
            <img src="images/img3.jfif" alt="" />
          </div>
          <div class="img-bg">
            <h3>Aakash Agrawal</h3>
            <p class="text-gray">Chartered Accountant C.A</p>
          </div>
        </div>
      </div>
    </section>

    <!--task-2-->
    <section class="padding">
      <div class="container display-flex">
        <div class="op" id="op1">
          <div class="op1-circle"></div>
          <i class="fa-solid fa-arrow-right text-white"></i>
          <h2 class="margin">This is option 1</h2>
          <p class="text-gray">
            Card discription with lots of great facts and details.
          </p>
        </div>

        <div class="op display-flex" id="op4">
          <div class="w-80">
            <i class="fa-regular fa-house text-gray margin padding"></i>
            <h2 class="padding">This is option 4</h2>
            <p class="text-gray padding">
              Card discription with lots of great facts and details.
            </p>
          </div>
          <div class="purple-div">
            <i class="fa-solid fa-arrow-right arrow2"></i>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
